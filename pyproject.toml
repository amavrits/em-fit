[project]
name = "em-fit"
version = "0.1.0"
description = "Expectation-maximization for one-dimensional finite mixture models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Plotting is an examples concern, not a runtime dependency of the library.
examples = [
    "matplotlib>=3.11.1",
]
# Reference implementation to benchmark against; not needed to use the library.
bench = [
    "scikit-learn>=1.5",
]

[tool.uv]
default-groups = ["dev", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["em"]

[tool.pytest.ini_options]
testpaths = ["tests"]
