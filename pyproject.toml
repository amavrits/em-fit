[project]
name = "em-fit"
version = "0.1.0"
description = "Expectation-maximization for finite mixture models: built-in families, custom log-likelihoods, mixtures of regressions, and semi-supervised fits with anchors"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "amavrits", email = "amavrits@gmail.com" }]
keywords = ["expectation-maximization", "EM", "mixture-model", "gaussian-mixture", "clustering", "semi-supervised", "clusterwise-regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/amavrits/em-fit"
Repository = "https://github.com/amavrits/em-fit"
Issues = "https://github.com/amavrits/em-fit/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Plotting is an examples concern, not a runtime dependency of the library.
examples = [
    "matplotlib>=3.11.1",
]
# Reference implementation to benchmark against; not needed to use the library.
bench = [
    "scikit-learn>=1.5",
]

[tool.uv]
default-groups = ["dev", "examples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["em"]

# The source distribution carries the tests and example scripts but not the
# rendered figures and animations, which are several megabytes of output.
[tool.hatch.build.targets.sdist]
exclude = ["examples/*.png", "examples/*.gif", "examples/*.mp4", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
